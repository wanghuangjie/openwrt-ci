name: ZN-M2-6.12-NIKKI

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LiBwrt/openwrt-6.x.git
  REPO_BRANCH: main-nss

  CONFIG_FILE: configs/ipq60xx-6.12-nowifi.config
  DIY_SCRIPT: diy-script.sh

  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true

  FIRMWARE_TAG: ZN-M2-6.12-NIKKI

  TZ: Asia/Shanghai


jobs:

  Build:

    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:

    # ========================================================
    # 检查服务器
    # ========================================================

    - name: Check Server Performance
      run: |
        echo "---------------- CPU ----------------"
        nproc
        lscpu | grep "Model name" || true

        echo "---------------- Memory -------------"
        free -h

        echo "---------------- Disk ---------------"
        df -hT


    # ========================================================
    # 初始化编译环境
    # ========================================================

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive

      run: |

        sudo bash -c \
        'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

        sudo -E apt -yqq install \
          dos2unix \
          libfuse-dev

        sudo timedatectl set-timezone "$TZ"


    # ========================================================
    # 扩大 GitHub Actions 编译空间
    # ========================================================

    - name: Combine Disks

      uses: easimon/maximize-build-space@master

      with:

        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024


    # ========================================================
    # Checkout 自己的 CI Repo
    # ========================================================

    - name: Checkout

      uses: actions/checkout@main


    # ========================================================
    # Clone LiBwrt
    # ========================================================

    - name: Clone Source Code

      run: |

        df -hT $GITHUB_WORKSPACE

        git clone \
          --depth 1 \
          -b $REPO_BRANCH \
          $REPO_URL \
          openwrt

        cd openwrt

        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

        VERSION_INFO=$(git show \
          -s \
          --date=short \
          --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")

        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV


    # ========================================================
    # 初次读取设备配置
    # ========================================================

    - name: Generate Variables

      run: |

        cp "$CONFIG_FILE" "$OPENWRT_PATH/.config"

        cd "$OPENWRT_PATH"

        make defconfig > /dev/null 2>&1

        SOURCE_REPO="$(basename "$REPO_URL" .git)"

        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV

        DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD .config | \
          awk -F '"' '{print $2}')

        DEVICE_SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET .config | \
          awk -F '"' '{print $2}')

        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV


    # ========================================================
    # Cache
    # ========================================================

    - name: Cache Toolchain

      if: env.CACHE_TOOLCHAIN == 'true'

      uses: HiGarfield/cachewrtbuild@main

      with:

        ccache: false

        mixkey: >
          ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{
          env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}

        prefix: ${{ env.OPENWRT_PATH }}


    # ========================================================
    # 加载配置 + DIY
    #
    # diy-script.sh 内：
    #
    # 1. 添加 Nikki feed
    # 2. feeds update
    # 3. feeds install
    #
    # ========================================================

    - name: Load Custom Configuration

      run: |

        if [ -e files ]; then
          mv files "$OPENWRT_PATH/files"
        fi

        cp "$CONFIG_FILE" "$OPENWRT_PATH/.config"

        chmod +x "$DIY_SCRIPT"

        cd "$OPENWRT_PATH"

        "$GITHUB_WORKSPACE/$DIY_SCRIPT"


    # ========================================================
    # 最终生成配置
    # ========================================================

    - name: Generate Final Config

      run: |

        cd "$OPENWRT_PATH"

        make defconfig

        echo "================ ZN M2 ================="

        grep "CONFIG_TARGET.*zn_m2" .config || true

        echo "================ Nikki ================="

        grep -E \
        "CONFIG_PACKAGE_(nikki|luci-app-nikki|mihomo-meta)" \
        .config || true

        echo "=============== WireGuard ==============="

        grep -E \
        "CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard)" \
        .config || true

        echo "=============== Mosquitto ==============="

        grep -E \
        "CONFIG_PACKAGE_(mosquitto|mosquitto-client)" \
        .config || true


    # ========================================================
    # 下载源码包
    # ========================================================

    - name: Download DL Package

      run: |

        cd "$OPENWRT_PATH"

        make download -j8

        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;


    # ========================================================
    # 编译
    # ========================================================

    - name: Compile Firmware

      id: compile

      run: |

        cd "$OPENWRT_PATH"

        echo "$(nproc) thread compile"

        make -j$(nproc) || \
        make -j1 || \
        make -j1 V=s

        echo "status=success" >> $GITHUB_OUTPUT

        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" \
          >> $GITHUB_ENV

        echo "FILE_DATE=$(date +"%Y.%m.%d")" \
          >> $GITHUB_ENV


    # ========================================================
    # 空间
    # ========================================================

    - name: Check Space Usage

      if: (!cancelled())

      run: df -hT


    # ========================================================
    # 整理固件
    # ========================================================

    - name: Organize Files

      if: steps.compile.outputs.status == 'success'

      run: |

        cd "$OPENWRT_PATH"/bin/targets/*/*

        cat sha256sums

        cp "$OPENWRT_PATH/.config" build.config

        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV


    # ========================================================
    # Release
    # ========================================================

    - name: Upload Firmware To Release

      if: >
        steps.compile.outputs.status == 'success' &&
        env.FIRMWARE_RELEASE == 'true'

      uses: ncipollo/release-action@v1

      with:

        name: R${{ env.DATE }} for ZN-M2

        allowUpdates: true

        tag: ${{ env.FIRMWARE_TAG }}

        token: ${{ secrets.GITHUB_TOKEN }}

        artifacts: ${{ env.FIRMWARE_PATH }}/*

        body: |

          # ZN M2 OpenWrt

          **Target**
          - ZN M2
          - Qualcomm IPQ60xx

          **System**
          - LiBwrt
          - Kernel 6.12
          - NSS
          - No WiFi
          - No USB

          **Proxy**
          - Nikki
          - Mihomo

          **VPN**
          - WireGuard

          **Services**
          - Mosquitto
          - Lucky
          - DDNS
          - UPnP
          - WOL Plus
          - TTYD

          **Network**
          - firewall4 / nftables
          - dnsmasq-full
          - PPPoE

          Default IP:
          192.168.1.1
