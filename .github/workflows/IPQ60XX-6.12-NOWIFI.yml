
name: ZN-M2-6.12-NOWIFI

on:
  workflow_dispatch:

concurrency:
  group: zn-m2-6.12-nowifi
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_URL: https://raw.githubusercontent.com/wanghuangjie/openwrt-ci/main/configs/zn-m2-nikki.config
  DIY_URL: https://raw.githubusercontent.com/wanghuangjie/openwrt-ci/main/diy-script.sh
  FIRMWARE_TAG: ZN-M2-6.12-NOWIFI
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Prepare build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix libfuse-dev
          sudo timedatectl set-timezone "$TZ"

      - name: Clone LiBwrt source
        run: git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: Load configuration
        run: |
          curl -fsSL "$CONFIG_URL" -o openwrt/.config
          curl -fsSL "$DIY_URL" -o /tmp/zn-m2-diy.sh
          chmod +x /tmp/zn-m2-diy.sh
          cd openwrt
          /tmp/zn-m2-diy.sh

      - name: Generate and validate final config
        run: |
          cd openwrt
          echo "=== pre-defconfig config ==="
          grep -E '^(CONFIG_PACKAGE_(mihomo|nikki|luci-app-nikki|luci-i18n-nikki))' .config || true
          echo "=== feed links ==="
          ls -la package/feeds/nikki 2>/dev/null || true
          make defconfig
          echo "=== Nikki feed packages ==="
          find package/feeds/nikki -maxdepth 2 -type f -name Makefile -print 2>/dev/null | sort || true
          echo "=== target and proxy config ==="
          grep -E '^(CONFIG_TARGET_PROFILE|CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2|CONFIG_PACKAGE_(mihomo|nikki|luci-app-nikki|luci-i18n-nikki))' .config || true
          grep -qx 'CONFIG_TARGET_PROFILE="DEVICE_zn_m2"' .config
          grep -qx 'CONFIG_PACKAGE_mihomo-meta=y' .config
          grep -qx 'CONFIG_PACKAGE_nikki=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-nikki=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y' .config
          ! grep -qx 'CONFIG_PACKAGE_mihomo-alpha=y' .config
          ! grep -Eq '^CONFIG_PACKAGE_(kmod-ath11k|ath11k-firmware-.*|wpad.*|hostapd.*|kmod-usb.*|usb-modeswitch|usbutils|usbmuxd)=y$' .config
          grep -E '^(CONFIG_TARGET_.*zn_m2|CONFIG_PACKAGE_kmod-qca-nss-(dp|drv|ecm))' .config || true

      - name: Download packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZN-M2-6.12-NOWIFI
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*zn_m2*
            openwrt/.config
          if-no-files-found: warn
